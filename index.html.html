<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班表管理系統</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --success-color: #27ae60;
            --danger-color: #c0392b;
            --warning-color: #f39c12;
            --light-bg: #ecf0f1;
        }
        * { box-sizing: border-box; font-family: "Microsoft JhengHei", Arial, sans-serif; }
        body { background-color: #7f8c8d; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        
        .window-container {
            width: 750px;
            background: white;
            border: 3px solid var(--primary-color);
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        
        .window-header {
            background: var(--primary-color);
            color: white;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            user-select: none;
        }
        .window-close-disabled { color: #bdc3c7; cursor: not-allowed; font-size: 18px; font-weight: bold; }
        .window-content { padding: 25px; min-height: 350px; background: #fafafa; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #34495e; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 14px; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 4px; color: white; font-weight: bold; font-size: 15px; cursor: pointer; transition: background 0.2s; }
        .btn-primary { background: var(--primary-color); }
        .btn-success { background: var(--success-color); }
        .btn-danger { background: var(--danger-color); }
        .btn-secondary { background: #7f8c8d; }

        .admin-layout { display: flex; gap: 20px; }
        .admin-form { flex: 1; }
        .admin-list-box { width: 350px; background: white; border: 1px solid #bdc3c7; border-radius: 4px; padding: 10px; height: 260px; overflow-y: auto; }
        .user-item { padding: 8px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 14px; }
        .user-item:hover { background: #edf2f7; }
        .user-item.selected { background: #bee3f8; }

        .welcome-msg { font-size: 18px; font-weight: bold; margin-bottom: 20px; color: var(--primary-color); text-align: center; }
        .loading-mask { display: none; text-align: center; font-weight: bold; color: var(--primary-color); padding: 10px; }
    </style>
</head>
<body>

    <!-- 1. 登入視窗 -->
    <div id="winLogin" class="window-container" style="display: flex; width: 400px;">
        <div class="window-header">
            <span>班表管理系統 - 登入</span>
            <span class="window-close-disabled">X</span>
        </div>
        <div class="window-content">
            <div class="form-group">
                <label>帳號：</label>
                <input type="text" id="loginUser" placeholder="請輸入帳號">
            </div>
            <div class="form-group">
                <label>密碼：</label>
                <input type="password" id="loginPass" placeholder="請輸入密碼">
            </div>
            <div id="loginLoading" class="loading-mask">連線雲端資料庫中...</div>
            <div class="btn-group">
                <button class="btn-success" onclick="handleLogin()">登入</button>
                <button class="btn-danger" onclick="handleExit()">EXIT</button>
            </div>
        </div>
    </div>

    <!-- 2. 主功能視窗 -->
    <div id="winMain" class="window-container">
        <div class="window-header">
            <span>班表管理系統 - 主頁面</span>
            <span class="window-close-disabled">X</span>
        </div>
        <div class="window-content">
            <div id="mainWelcome" class="welcome-msg">歡迎登入</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <button class="btn-primary" onclick="alert('功能開發中：查看個人班表')">查看個人班表</button>
                <button class="btn-primary" onclick="switchWindow('winMain', 'winLeave')">線上劃休 / 請假假單</button>
                <button id="btnManage" class="btn-primary" onclick="switchWindow('winMain', 'winManager'); initManagerPage();">排班與審核假單</button>
                <button id="btnAdmin" class="btn-primary" onclick="switchWindow('winMain', 'winAdmin'); initAdminPage();">後台人員管理</button>
            </div>
            <div class="btn-group">
                <button class="btn-danger" onclick="handleExit()">EXIT (關閉系統)</button>
            </div>
        </div>
    </div>

    <!-- 3. 線上劃休/請假視窗 -->
    <div id="winLeave" class="window-container">
        <div class="window-header">
            <span>線上劃休與請假系統</span>
            <span class="window-close-disabled">X</span>
        </div>
        <div class="window-content">
            <div class="form-group">
                <label>假別：</label>
                <select id="leaveType">
                    <option value="劃休">劃休</option>
                    <option value="事假">事假</option>
                    <option value="病假">病假</option>
                    <option value="特休">特休</option>
                </select>
            </div>
            <div class="form-group">
                <label>選擇請假日期：</label>
                <input type="date" id="leaveDate">
            </div>
            <div class="btn-group">
                <button class="btn-success" onclick="handleSubmitLeave()">提交假單</button>
                <button class="btn-secondary" onclick="switchWindow('winLeave', 'winMain')">返回主頁</button>
                <button class="btn-danger" onclick="handleExit()">EXIT</button>
            </div>
        </div>
    </div>

    <!-- 4. 主管審核假單視窗 -->
    <div id="winManager" class="window-container" style="width: 780px;">
        <div class="window-header">
            <span>主管排班與假單審核系統</span>
            <span class="window-close-disabled">X</span>
        </div>
        <div class="window-content">
            <div class="admin-layout">
                <div class="admin-form">
                    <h3 style="margin-top:0;">假單詳細資訊</h3>
                    <div class="form-group"><label>申請同仁：</label><input type="text" id="mgrName" readonly></div>
                    <div class="form-group"><label>請假日期：</label><input type="text" id="mgrDate" readonly></div>
                    <div class="form-group"><label>假別項目：</label><input type="text" id="mgrType" readonly></div>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn-success" onclick="handleReview('核准')">准假 (核准)</button>
                        <button class="btn-danger" onclick="handleReview('拒絕')">駁回 (拒絕)</button>
                    </div>
                </div>
                <div>
                    <label style="font-weight: bold; display: block; margin-bottom: 5px;">待審核假單清單：</label>
                    <div id="leaveListBox" class="admin-list-box"></div>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn-secondary" onclick="switchWindow('winManager', 'winMain')">返回主頁</button>
                <button class="btn-danger" onclick="handleExit()">EXIT</button>
            </div>
        </div>
    </div>

    <!-- 5. 後台人員管理視窗 -->
    <div id="winAdmin" class="window-container" style="width: 780px;">
        <div class="window-header">
            <span>後台人員管理系統</span>
            <span class="window-close-disabled">X</span>
        </div>
        <div class="window-content">
            <div class="admin-layout">
                <div class="admin-form">
                    <div class="form-group"><label>帳號：</label><input type="text" id="admUser"></div>
                    <div class="form-group"><label>密碼：</label><input type="text" id="admPass"></div>
                    <div class="form-group"><label>姓名：</label><input type="text" id="admName"></div>
                    <div class="form-group">
                        <label>權限層級：</label>
                        <select id="admRole">
                            <option value="管理員">管理員</option>
                            <option value="主管">主管</option>
                            <option value="一般使用者">一般使用者</option>
                        </select>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn-success" onclick="handleSaveUser()">新增/修改</button>
                        <button class="btn-danger" onclick="handleDeleteUser()">刪除帳號</button>
                    </div>
                </div>
                <div>
                    <label style="font-weight: bold; display: block; margin-bottom: 5px;">目前員工清單：</label>
                    <div id="userListBox" class="admin-list-box"></div>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn-secondary" onclick="switchWindow('winAdmin', 'winMain')">返回主頁</button>
                <button class="btn-danger" onclick="handleExit()">EXIT</button>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ 請在此處填入你剛剛重新部署獲得的 Google Apps Script URL
        const API_URL = "https://script.google.com/macros/s/AKfycby4rGVD2YqsdfUaHHoqg1SiwQi8iyVDHpNJT09dcj6h_oR3d3T9uQ-GiyA3cMie8VLVlA/exec";

        let currentUser = null;
        let selectedUserIndex = -1;
        let selectedLeaveId = null;
        let globalUsersDB = [];
        let globalLeavesDB = [];

        // 網頁開啟時，預先向雲端要求抓取最新的人員資料庫
        window.onload = function() {
            fetchUsersFromCloud();
